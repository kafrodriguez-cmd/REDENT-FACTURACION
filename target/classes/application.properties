spring.application.name=redent-local
spring.config.import=optional:file:./config/redent.properties
spring.profiles.default=demo
server.address=${REDENT_BIND:127.0.0.1}
server.port=${REDENT_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
redent.admin-user=${REDENT_ADMIN_USER:admin}
redent.admin-password=${REDENT_ADMIN_PASSWORD:}
redent.mh.enabled=${MH_ENABLED:false}
redent.mh.api-password=${MH_API_PASSWORD:}
redent.mh.signer-password=${MH_SIGNER_PASSWORD:}
redent.mh.signer-url=http://127.0.0.1:8113/firmardocumento/
redent.mh.base-url=https://apitest.dtes.mh.gob.sv
redent.mh.ambiente=00
redent.mail.enabled=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
